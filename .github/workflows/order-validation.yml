name: Order validation
on:
  pull_request:
    branches: [main, kakao-reports-order-operations]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: order-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run unit and synthetic regression checks
        run: python validation/run_ci.py --output /tmp/order-validation-results
      - name: Upload aggregate synthetic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-validation-aggregate
          path: /tmp/order-validation-results/*.json
          if-no-files-found: ignore
          retention-days: 7
