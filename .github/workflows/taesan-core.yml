name: Taesan platform core validation
on:
  pull_request:
    paths:
      - 'taesan_core/**'
      - 'tests/test_taesan_core.py'
      - '.github/workflows/taesan-core.yml'
  push:
    branches: ['codex/taesan-platform-core-*', 'codex/taesan-company-commerce-*']
    paths:
      - 'taesan_core/**'
      - 'tests/test_taesan_core.py'
      - '.github/workflows/taesan-core.yml'
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s taesan_core/tests -t . -v
      - run: git diff --check
