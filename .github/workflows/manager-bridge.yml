name: Manager bridge validation

on:
  pull_request:
    paths:
      - 'manager_bridge/**'
      - 'taesan_core/**'
      - 'tests/test_taesan_core.py'
      - 'tests/test_manager_bridge.py'
      - 'scripts/maintenance_fixture.py'
      - 'scripts/prepare_connection_review.py'
      - 'scripts/export_model_lab.py'
      - 'scripts/export_conversation_benchmark.py'
      - 'scripts/rehearse_conversation.py'
      - 'scripts/run_project_receiver.py'
      - 'scripts/run_continuous_manager.py'
      - 'scripts/rehearse_project_runtime.py'
      - 'tests/test_manager_host.py'
      - '.github/workflows/manager-bridge.yml'
  push:
    branches:
      - 'codex/taesan-manager-*'
      - 'codex/taesan-maintenance-*'
      - 'codex/taesan-delegated-*'
      - 'codex/taesan-connection-*'
      - 'codex/taesan-project-*'
      - 'codex/taesan-conversation-*'
      - 'codex/taesan-three-tier-*'
      - 'codex/taesan-continuous-*'
    paths:
      - 'manager_bridge/**'
      - 'taesan_core/**'
      - 'tests/test_taesan_core.py'
      - 'tests/test_manager_bridge.py'
      - 'scripts/maintenance_fixture.py'
      - 'scripts/prepare_connection_review.py'
      - 'scripts/export_model_lab.py'
      - 'scripts/export_conversation_benchmark.py'
      - 'scripts/rehearse_conversation.py'
      - 'scripts/run_project_receiver.py'
      - 'scripts/run_continuous_manager.py'
      - 'scripts/rehearse_project_runtime.py'
      - 'tests/test_manager_host.py'
      - '.github/workflows/manager-bridge.yml'

permissions:
  contents: read

concurrency:
  group: manager-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manager crypto, image comparison and result export dependencies
        run: python -m pip install -r manager_bridge/runtime-requirements.txt "Pillow>=11,<14" "openpyxl==3.1.5"
      - name: Validate independent manager protocol with fixture providers
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s manager_bridge/tests -t . -q
      - name: Validate reused portable company core
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s taesan_core/tests -t . -q
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
