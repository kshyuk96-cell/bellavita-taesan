services:
  - type: worker
    name: bellavita-erp-production
    runtime: docker
    repo: https://github.com/kshyuk96-cell/bellavita-taesan
    branch: codex/erp-production-bootstrap-20261116
    dockerfilePath: ./deploy/erp-production/Dockerfile
    dockerContext: ./deploy/erp-production
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    autoDeployTrigger: 'off'
    maxShutdownDelaySeconds: 300
    envVars:
      - key: ERP_BASE_URL
        value: https://bellavita-erp-workbench.shrewdmaxim1.chatgpt.site
      - key: ERP_SITE_TOKEN
        sync: false
      - key: ERP_WORKER_KEY
        generateValue: true
      - key: ERP_RUNTIME_SHA256
        value: a4b77a3ff448a34d36f24884b71a0a0362d877431a731ed8ae3ca7fc2c10d8c6
