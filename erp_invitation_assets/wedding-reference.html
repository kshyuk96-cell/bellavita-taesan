<style>
*{box-sizing:border-box}body{margin:0;background:#e9e5db;color:#24271f;font:15px/1.75 "Noto Sans KR",system-ui,sans-serif}main{max-width:590px;margin:auto;background:#f9f7ef;box-shadow:0 0 55px #342e2418}p,figure{margin:0}h1,h2{margin:0 0 13px;line-height:1.28;letter-spacing:-.05em}h2{font-size:25px;font-weight:600}.portrait{display:block;width:100%;height:auto}section{padding:37px clamp(22px,7vw,48px);text-align:center;border-top:1px solid #e1dace}

.ceremony-details{text-align:center;padding-inline:clamp(14px,4vw,32px)}
.ceremony-details h2{font-family:"Noto Serif KR",serif;font-size:clamp(30px,6.5vw,38px);margin-bottom:24px}
.ceremony-details .couple-details{font-size:clamp(17px,4.8vw,23px);line-height:1.7;margin-bottom:26px;word-break:keep-all}
.ceremony-details dl{max-width:460px}
.ceremony-details dl div{display:block;text-align:center;padding:12px 0 17px}
.ceremony-details dt{font-size:18px;font-weight:600;margin-bottom:4px}
.ceremony-details dd{font-family:"Noto Serif KR",serif;font-size:clamp(22px,5.5vw,29px);line-height:1.5;word-break:keep-all}

<section class="invitation"><article class="letter"><h1>결혼식에 초대드립니다.</h1><div class="greeting">{{GREETING}}<p class="signature">{{SIGNATURE}}</p></div></article></section>
